# Checks the model image's packages on Linux before they reach main. The image
# itself is built only on the GPU server, so this is the first place a
# conflict or a known vulnerability shows up.

name: Model packages

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'requirements-override.txt'
      - '.github/workflows/check-model-packages.yml'
  workflow_dispatch:

jobs:
  check:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    # The same install as the Dockerfile, without downloading the wheels.
    - name: The packages install together
      run: |
        python -m pip install --upgrade pip
        pip install --dry-run --ignore-installed --quiet --report report.json \
          --extra-index-url https://www.paddlepaddle.org.cn/packages/stable/cu126/ \
          -r requirements.txt
        python - <<'PY' > resolved.txt
        import json, re
        # The Dockerfile installs requirements-override.txt last, so its pins win.
        override = {}
        for line in open("requirements-override.txt"):
            m = re.match(r"([A-Za-z0-9_.-]+)==([^\s#]+)", line)
            if m:
                override[m.group(1).lower()] = m.group(2)
        for i in json.load(open("report.json"))["install"]:
            name = i["metadata"]["name"]
            print(f'{name}=={override.pop(name.lower(), i["metadata"]["version"])}')
        for name, pinned in override.items():
            print(f'{name}=={pinned}')
        PY
        cat resolved.txt

    # The ignored IDs are held back by the Volta pins (docs/UPDATING.md):
    # PYSEC-2025-194 in torch, the other two in setuptools, which torch caps.
    - name: No known vulnerabilities
      run: |
        pip install pip-audit==2.10.1
        pip-audit -r resolved.txt --no-deps --disable-pip --progress-spinner off \
          --ignore-vuln PYSEC-2025-194 \
          --ignore-vuln PYSEC-2026-3447 \
          --ignore-vuln GHSA-xmj3-9gf7-h52w

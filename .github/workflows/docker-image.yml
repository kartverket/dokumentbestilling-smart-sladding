name: Deploy Image to GHCR

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - push_docker_to_GHCR
  workflow_dispatch:

jobs:
  push-python-image:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v2

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build and Push Python Image'
        run: |
          docker build -f Dockerfile -t ghcr.io/kartverket/smart_sladding_ml:latest .
          docker push ghcr.io/kartverket/smart_sladding_ml:latest

name: Deploy Image to GHCR

on:
  push:
    branches:
      - push_docker_to_GHCR
  workflow_dispatch:

jobs:
  push-python-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './smart_sladding_ml'
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: 'Build and Push Python Image'
        run: |
          docker build . --tag ghcr.io/oskaramm/smart_sladding_ml:latest
          docker push ghcr.io/oskaramm/smart_sladding_ml:latest

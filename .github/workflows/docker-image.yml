name: Deploy Image to GHCR

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - push_docker_to_GHCR
  workflow_dispatch:

jobs:
  push-python-image:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v2

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v1

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build and Push Python Image'
        run: |
          IMAGE_TAG=ghcr.io/kartverket/smart_sladding_ml:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: 'Tag the image with "latest"'
        run: |
          IMAGE_TAG=ghcr.io/kartverket/smart_sladding_ml:${{ github.sha }}
          docker tag $IMAGE_TAG ghcr.io/kartverket/smart_sladding_ml:latest
          docker push ghcr.io/kartverket/smart_sladding_ml:latest

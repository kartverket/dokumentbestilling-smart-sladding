name: Deploy Image to GHCR

permissions:
  contents: read
  packages: write
  id-token: write

on:
  push:
    branches:
      - main
  workflow_call:
    outputs:
      short_sha:
        description: "The sha of the image"
        value: ${{ jobs.push-python-image.outputs.short_sha }}
  workflow_dispatch:
  
jobs:
  push-python-image:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.setOutput.outputs.short_sha }}
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v5

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v3

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build and Push Python Image'
        run: |
          cd job
          IMAGE_TAG=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: 'Tag the image with "latest"'
        run: |
          IMAGE_TAG=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag $IMAGE_TAG ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

      - name: Set output with build values
        id: setOutput
        run: |
          echo "short_sha=${{ github.sha }}" >> $GITHUB_OUTPUT

  argocd-sync:
    needs: push-python-image
    uses: kartverket/eiet-apps/.github/workflows/release-app.yml@main
    with:
      imageurl: ghcr.io/${{ github.repository }}:${{ needs.push-python-image.outputs.short_sha }}
      branch: ${{ github.head_ref || github.ref_name }}
      namespace_prefix: dokumentbestilling
      version_file: smart-sladding-version
      application: dokumentbestilling-smart-sladding

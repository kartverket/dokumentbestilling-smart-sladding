name: Deploy Image to GHCR

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
    outputs:
      image_sha:
        description: "The sha of the image"
        value: ${{ jobs.push-python-image.outputs.image_sha }}
  workflow_dispatch:
  


jobs:
  push-python-image:
    runs-on: ubuntu-latest
    outputs:
      image_sha: ${{ steps.setOutput.outputs.image_sha }}
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v2

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v1

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Build and Push Python Image'
        run: |
          IMAGE_TAG=ghcr.io/kartverket/smart_sladding_ml:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: 'Tag the image with "latest"'
        run: |
          IMAGE_TAG=ghcr.io/kartverket/smart_sladding_ml:${{ github.sha }}
          docker tag $IMAGE_TAG ghcr.io/kartverket/smart_sladding_ml:latest
          docker push ghcr.io/kartverket/smart_sladding_ml:latest

      - name: Set output with build values
        id: setOutput
        run: |
          echo "image_sha=ghcr.io/kartverket/smart_sladding_ml:${{ github.sha }}" >> $GITHUB_OUTPUT

  argocd-sync:
    needs: push-python-image
    secrets:
      PAT_REPO: ${{ secrets.PAT_REPO }}
    uses: kartverket/eiet-apps/.github/workflows/kopier-image-smartsladding-dev.yml@main
    with:
      imageurl: ${{ needs.push-python-image.outputs.image_sha }}
        
        
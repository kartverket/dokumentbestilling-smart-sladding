# Runs the guards that need no GPU, no VLM server and no documents.

name: CI

permissions:
  contents: read

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: No valid fødselsnummer in tracked files
      run: |
        python utils/fnr_vakt.py --selftest
        python utils/fnr_vakt.py --all

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install $(grep -E '^(PyMuPDF|Pillow|numpy)==' requirements.txt)

    - name: Run the VLM selftest
      run: python utils/vlm_selftest.py

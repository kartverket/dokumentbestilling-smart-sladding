# Runs the guards that need no GPU, no VLM server and no documents.

name: CI

permissions:
  contents: read

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.12'

    - name: No valid fødselsnummer in tracked files
      run: |
        python utils/fnr_vakt.py --selftest
        python utils/fnr_vakt.py --all

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install $(grep -E '^(PyMuPDF|Pillow|numpy)==' requirements.txt)

    - name: Run the VLM selftest
      run: python utils/vlm_selftest.py

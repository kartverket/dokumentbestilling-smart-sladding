version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The base image must match the cu126 wheels of torch and paddle in the
      # Dockerfile. CUDA 13 also dropped Volta (sm_70), which the server runs.
      - dependency-name: "nvidia/cuda"
        versions: [">=12.7"]

  - package-ecosystem: "docker"
    directory: "/job"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned for sm_70; the Dockerfile reinstalls the cu126 build.
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      # A new ultralytics changes the YOLO scores on the same page, so a bump
      # needs a recall check on labelled data first.
      - dependency-name: "ultralytics"
      # paddlex pins this exact version, so a bump cannot install.
      - dependency-name: "opencv-contrib-python"

  - package-ecosystem: "pip"
    directory: "/job"
    schedule:
      interval: "weekly"

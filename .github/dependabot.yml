version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The base image must match the cu126 wheels of torch and paddle in the
      # Dockerfile. CUDA 13 also dropped Volta (sm_70), which the server runs.
      - dependency-name: "nvidia/cuda"
        versions: [">=12.7"]

  - package-ecosystem: "docker"
    directory: "/job"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned for sm_70; the Dockerfile reinstalls the cu126 build.
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      # paddlex requires numpy below 2.4.
      - dependency-name: "numpy"
        versions: [">=2.4"]

  - package-ecosystem: "pip"
    directory: "/job"
    schedule:
      interval: "weekly"

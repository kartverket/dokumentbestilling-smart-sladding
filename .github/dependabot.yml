version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # CUDA 13 dropped Volta (sm_70), which the server runs.
      - dependency-name: "nvidia/cuda"
        versions: [">=13"]

  - package-ecosystem: "docker"
    directory: "/job"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned for sm_70; the Dockerfile reinstalls the cu126 build.
      - dependency-name: "torch"
      - dependency-name: "torchvision"

  - package-ecosystem: "pip"
    directory: "/job"
    schedule:
      interval: "weekly"

# Prod og test kjører samme image — kun tag og port skiller dem.
#
# Compose bygger aldri noe her. Bygging skjer i ./deploy.sh, som gir
# imaget en uforanderlig tag. Da endrer ikke prod seg av at noen bygger
# noe nytt, og rollback er å peke PROD_TAG tilbake på en gammel tag.
#
# Imagene finnes bare lokalt på serveren, så «docker image prune -a»
# fjerner muligheten til å rulle tilbake.
#
# Port 5071 er alltid prod. Test ligger bak en compose-profil, så et
# bart "docker compose up -d" ikke starter en testcontainer som spiser
# GPU-minne ved siden av prod.

name: smsl

x-felles: &felles
  restart: unless-stopped
  environment:
    HTTP_PROXY: ${PROXY:-http://159.162.48.7:3128}
    HTTPS_PROXY: ${PROXY:-http://159.162.48.7:3128}
    # Loggstier inne i containeren. Verten monterer inn under
    # ${LOG_ROOT}, som deploy.sh henter fra SLADD_LOGS i server.env.
    GUNICORN_LOG_DIR: /data/gunicorn_logs
    ML_LOG_DIR: /data/ml_logs
    LOG_BACKUP_DAYS: ${LOG_BACKUP_DAYS:-30}
  # Access-, error- og applikasjonsloggen roterer og zippes selv, inn i
  # de monterte mappene. Dette taket gjelder stray stdout/stderr, som
  # ellers vokser uten grense i docker sin egen json-loggfil.
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  prod:
    <<: *felles
    image: ${IMAGE:-smart-sladding}:${PROD_TAG:-ikke-satt}
    container_name: smsl-prod
    pull_policy: never
    ports:
      - "5071:8080"
    volumes:
      - ${LOG_ROOT:-/data/docker}/gunicorn_logs:/data/gunicorn_logs
      - ${LOG_ROOT:-/data/docker}/ml_logs:/data/ml_logs

  test:
    <<: *felles
    image: ${IMAGE:-smart-sladding}:${TEST_TAG:-ikke-satt}
    container_name: smsl-test
    pull_policy: never
    profiles: ["test"]
    restart: "no"
    ports:
      - "${TEST_PORT:-5072}:8080"
    volumes:
      - ${LOG_ROOT:-/data/docker}/gunicorn_logs_test:/data/gunicorn_logs
      - ${LOG_ROOT:-/data/docker}/ml_logs_test:/data/ml_logs
